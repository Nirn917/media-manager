name: cleanup-branch-image

# Removes the GHCR image tag(s) associated with a deleted git branch.
# Fires automatically when a branch is deleted (e.g. PR merge with the
# "Delete branch" option, or a manual `git push origin :branch`).
#
# Why a PAT is required: GITHUB_TOKEN can push packages but cannot delete
# them. This job authenticates with the GHCR_DELETE_PAT repo secret (a
# classic Personal Access Token with scopes: read:packages + delete:packages
# for the user namespace where the package lives).
#
# Create the PAT at:
#   https://github.com/settings/tokens/new?scopes=read:packages,delete:packages,repo
# then add it as a repo/ACTIONS secret named GHCR_DELETE_PAT.

on:
  delete: {}

permissions:
  contents: read
  packages: read

jobs:
  cleanup:
    # Only branches trigger this flow (git tag deletions are rare and we leave
    # semver images alone). github.event.ref holds the deleted ref's short name.
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve package + tag name
        id: meta
        env:
          REF: ${{ github.event.ref }}
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER,,}" || echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          # The package name is the repo name (lowercase). GHCR listing requires
          # the org-qualified path in URL, user-scoped packages live under /user.
          pkg="$(echo "${GITHUB_REPOSITORY,,}" | cut -d/ -f2)"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "package=${pkg}" >> "$GITHUB_OUTPUT"
          # Match the tag produced by build-and-publish.yml step "img": branch-<safe>
          safe="$(echo "${REF}" | tr '/' '-')"
          echo "tag=branch-${safe}" >> "$GITHUB_OUTPUT"
          echo "Cleaning up tag branch-${safe} for package ${pkg}"

      - name: Delete matching tag(s) from GHCR
        env:
          GH_TOKEN: ${{ secrets.GHCR_DELETE_PAT }}
          OWNER: ${{ steps.meta.outputs.owner }}
          PACKAGE: ${{ steps.meta.outputs.package }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::GHCR_DELETE_PAT secret is not set - skipping cleanup. The branch-tagged image will remain on GHCR until deleted manually."
            exit 0
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required on the runner"; exit 1
          fi

          # GHCR packages owned by a user live at /user/packages/...; org-owned
          # packages live at /orgs/.../packages/.... We detect which by trying
          # the user endpoint first (repos owned by a single user publish to
          # user namespace by default).
          API="https://api.github.com"

          # Resolve recent package versions. We only inspect the 100 most recent
          # - branch-tagged images are deleted promptly so they will be near the top.
          get_versions() {
            local scope="$1"
            local path
            if [ "${scope}" = "user" ]; then
              path="/user/packages/container/${PACKAGE}/versions?per_page=100"
            else
              path="/orgs/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100"
            fi
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 "${API}${path}" || echo "[]"
          }

          delete_version() {
            local scope="$1" id="$2"
            local path
            if [ "${scope}" = "user" ]; then
              path="/user/packages/container/${PACKAGE}/versions/${id}"
            else
              path="/orgs/${OWNER}/packages/container/${PACKAGE}/versions/${id}"
            fi
            code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                 -H "Authorization: Bearer ${GH_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 "${API}${path}")
            echo "  delete version ${id}: HTTP ${code}"
          }

          deleted=0
          for scope in user org; do
            echo "=> scanning ${scope}-scoped package versions for tag '${TAG}'"
            versions_json="$(get_versions "${scope}")"
            # A 404 here surfaces as "[]" via the curl fallback above. jq filters
            # to versions whose metadata.container.tags array contains our tag.
            ids="$(printf '%s' "${versions_json}" | jq -r --arg t "${TAG}" \
                   '.[] | select((.metadata.container.tags // []) | index($t)) | .id' 2>/dev/null || true)"
            if [ -z "${ids}" ]; then
              echo "  no matching versions"
              continue
            fi
            for id in ${ids}; do
              delete_version "${scope}" "${id}"
              deleted=$((deleted + 1))
            done
            [ "${deleted}" -gt 0 ] && break
          done

          echo "Deleted ${deleted} version(s) tagged '${TAG}'."