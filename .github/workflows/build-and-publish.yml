name: build-and-publish

# Builds the media-manager Docker image and publishes it to GHCR
# (ghcr.io/nirn917/media-manager).
#
# Triggers:
#   - push to main (paths under the app + Dockerfile): tag :latest + :sha
#   - git tag v* : tag :vX.Y.Z + :sha + :latest
#   - PR: build-only (no push) to catch regressions
#   - manual: dispatch with optional image-tag override
#
# Auth: the default `GITHUB_TOKEN` is used (permissions: packages: write below);
# no PAT/token secret needed. Packages are published under the repo owner.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'nuxt.config.ts'
      - 'tailwind.config.ts'
      - 'components.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'app.vue'
      - 'assets/**'
      - 'components/**'
      - 'composables/**'
      - 'layouts/**'
      - 'lib/**'
      - 'middleware/**'
      - 'pages/**'
      - 'server/**'
      - 'types/**'
      - 'drizzle/**'
      - '.github/workflows/build-and-publish.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'pages/**'
      - 'components/**'
      - 'composables/**'
      - 'nuxt.config.ts'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag override (defaults to :latest + :sha)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Resolve image name
        id: img
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER,,}" || echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          repo="$(echo "${GITHUB_REPOSITORY,,}" | cut -d/ -f2)"
          echo "name=ghcr.io/${owner}/${repo}" >> "$GITHUB_OUTPUT"
          echo "Using image: ghcr.io/${owner}/${repo}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max